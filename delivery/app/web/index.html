<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隐盾 · 本地隐私防护网关</title>
  <meta name="description" content="隐盾 LLM-Shield：材料只在你本机脱敏后才发送，可上传文件、连续追问。" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>
  <!-- 背景层：发布会式流动极光（蓝 / 紫 / 青三团，缓慢漂移） -->
  <div class="app-bg" aria-hidden="true"><span class="aurora-cyan"></span></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="32" height="32" role="img" aria-label="隐盾">
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4DA2FF" />
              <stop offset="1" stop-color="#007AFF" />
            </linearGradient>
          </defs>
          <path d="M20 2.8 L34 8.6 V19.2 C34 27.4 27.9 33.7 20 37.2 C12.1 33.7 6 27.4 6 19.2 V8.6 Z"
                fill="url(#logo-grad)" />
          <path d="M20 11.4 L26.4 14 V19.4 C26.4 23.6 23.2 27.1 20 28.8 C16.8 27.1 13.6 23.6 13.6 19.4 V14 Z"
                fill="none" stroke="#ffffff" stroke-width="1.7" opacity=".95" />
          <circle cx="20" cy="20.2" r="2.1" fill="#ffffff" />
        </svg>
      </span>
      <div class="brand-text">
        <h1>隐盾</h1>
        <p class="sub">材料在本机脱敏后才发送</p>
      </div>
    </div>

    <div class="topbar-right">
      <button type="button" class="icon-glass" id="railToggle"
              title="收起 / 展开侧栏" aria-label="收起或展开侧栏" aria-expanded="true"></button>
      <span id="apiStatus" class="service-status" role="status">正在读取服务状态…</span>
    </div>
  </header>

  <main class="chat-layout">
    <aside class="config">
      <!-- 收起态：仅图标导航 -->
      <nav class="rail-nav" aria-label="侧栏导航">
        <button type="button" class="rail-btn" data-target="sec-task" title="要做什么">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l.9.9L6.8 5M4 12l.9.9 1.9-1.9M4 18l.9.9 1.9-1.9"/></svg>
        </button>
        <button type="button" class="rail-btn" data-target="sec-identity" title="你的身份">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.2c.9-3.1 3.7-4.8 7-4.8s6.1 1.7 7 4.8"/></svg>
        </button>
        <button type="button" class="rail-btn" data-target="sec-files" title="文件库">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h7A1.5 1.5 0 0 1 19 9.7v7.8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5Z"/></svg>
        </button>
        <button type="button" class="rail-btn" data-target="sec-privacy" title="隐私说明">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/></svg>
        </button>
      </nav>

      <div class="config-body">
        <div class="config-head">
          <button class="btn primary" id="newChat">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            新对话
          </button>
          <button class="icon-btn" id="clearChat" title="清除本次对话" aria-label="清除本次对话"></button>
        </div>

        <!-- ── 要做什么：具体意图选择器（替代原来只有 3 项的宏大下拉框） ── -->
        <section class="sec" id="sec-task">
          <h3 class="sec-title">要做什么</h3>
          <div class="picker" id="taskPicker">
            <button type="button" class="picker-trigger" id="task"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="taskLabel">
              <span class="picker-body">
                <span class="picker-name" id="taskLabel"></span>
                <span class="picker-desc" id="taskExample"></span>
              </span>
              <span class="picker-chevron" aria-hidden="true"></span>
            </button>
            <div class="picker-pop" id="taskPop" hidden></div>
          </div>
        </section>

        <!-- ── 你的身份：从「高级设置」拆出来常驻显示（它决定能读哪些材料） ── -->
        <section class="sec" id="sec-identity">
          <h3 class="sec-title">你的身份</h3>
          <div class="picker" id="identityPicker">
            <button type="button" class="picker-trigger is-compact" id="identity"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="identityLabel">
              <span class="picker-body">
                <span class="picker-name" id="identityLabel"></span>
              </span>
              <span class="picker-chevron" aria-hidden="true"></span>
            </button>
            <div class="picker-pop" id="identityPop" hidden></div>
          </div>
          <p class="sec-footnote" id="identityWhy"></p>
        </section>

        <!-- ── 额外处理要求：一行按钮原地展开，不占用常驻空间 ── -->
        <section class="sec" id="sec-req">
          <h3 class="sec-title">额外处理要求</h3>
          <button type="button" class="add-req" id="reqToggle"
                  aria-expanded="false" aria-controls="reqBody">
            <span class="add-req-text" id="reqSummary">添加要求（可选）</span>
            <span class="picker-chevron" aria-hidden="true"></span>
          </button>
          <div class="req-body" id="reqBody" hidden>
            <textarea id="description" rows="3" maxlength="4000"></textarea>
            <div class="req-foot">
              <span class="req-count" id="reqCount">0 / 4000</span>
              <button type="button" class="link-btn" id="reqClear">清空</button>
            </div>
          </div>
        </section>

        <section class="sec" id="sec-files">
          <h3 class="sec-title">文件库</h3>
          <div id="library" class="material-list" aria-live="polite"></div>
        </section>

        <details class="settings" id="sec-privacy">
          <summary>隐私与服务说明</summary>
          <p class="chat-note">文字和附件在同一对话中处理。发送前自动脱敏并检查完整历史，回答复检通过后才展示。</p>
          <p class="chat-note">历史和代号保存在本机内存，刷新后不自动恢复，闲置 30 分钟过期。清除对话会删除其原值匹配记录；本机文件需单独删除。</p>
          <p id="apiHelp" class="chat-note"></p>
        </details>

        <div id="modelStatus" class="model-status" role="status">
          <span class="model-status-text">正在检查本地模型…</span>
        </div>
      </div>
    </aside>

    <section class="chat-main">
      <div class="chat-heading">
        <div class="heading-text">
          <h2>对话</h2>
          <p class="heading-sub" id="headingTask"></p>
        </div>
        <div class="turns-wrap" id="turnsWrap"
             title="为保护隐私并节省本机算力，每段对话最多连续提问 20 轮；达到上限后本轮不会发送，请开启新对话。">
          <span class="turns-track"><span id="turnsBar" class="turns-bar"></span></span>
          <span id="turns" class="turns-label">0 / 20</span>
        </div>
      </div>

      <div class="chat-scroll">
        <!-- 状态条：只在「有消息要说」时出现（错误、已加文件、已发送…）。
             初始为空态服务，所以默认隐藏——否则它会和空态副标题
             重复讲同一件事（都说「发送前会自动脱敏」），违反 HIG 的
             "Say the same thing only once"。 -->
        <div id="notice" class="chat-notice" role="status" hidden></div>
        <div id="messages" class="chat-messages" aria-live="polite"></div>
        <details id="processing" class="processing" hidden>
          <summary>查看本轮隐私处理</summary>
          <div id="decisions"></div>
        </details>
      </div>

      <div class="composer-wrap">
        <form id="composer" class="chat-composer">
          <div id="attachments" class="attachments" aria-live="polite"></div>
          <div class="composer-capsule">
            <textarea id="message" rows="1" maxlength="12000" placeholder="输入问题，或先上传文件再提问…"></textarea>
            <label class="capsule-icon-btn" id="uploadBtn" title="上传文件">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5v11M6.5 12h11"/></svg>
              <input id="file" type="file" multiple hidden accept=".txt,.md,.csv,.tsv,.json,.docx,.xlsx,.pdf" />
            </label>
            <button class="capsule-send" id="send" type="submit" disabled aria-label="发送"></button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="/static/intents.js"></script>
  <script src="/static/identities.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
