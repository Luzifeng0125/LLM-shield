<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长材料上下文复核</title>
<style>body{font:16px/1.7 system-ui;margin:24px auto;padding:0 18px;max-width:1100px;color:#202a35;background:#f8fafc}header{position:sticky;top:0;background:#f8fafc;padding:12px 0;border-bottom:1px solid #cbd5e1}button,input,select,textarea{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:white;padding:18px;border:1px solid #e2e8f0}textarea{width:100%;min-height:90px}label{display:block;margin:14px 0}#status{color:#445369}mark{background:#fff0ad}nav{display:flex;gap:8px;flex-wrap:wrap}</style>
<header><strong>长材料上下文复核</strong><nav><button id="prev">上一处</button><button id="next">下一处</button><button id="save">确认本处</button><button id="export">导出复核</button><label>载入进度 <input id="load" type="file" accept=".json"></label></nav><span id="status"></span></header>
<p>先读前序记录和完整材料，再判断高亮信息在当前用途下如何表达。未选择并确认的题目保持待审。此页不提供机器建议；若已在其他文件中看过建议，请在导出中如实记录。</p>
<label>复核人 <input id="reviewer"></label><label><input id="assisted" type="checkbox">我看过本批机器建议</label>
<h2 id="request"></h2><h3>前序记录</h3><pre id="context"></pre><h3>完整材料</h3><pre id="doc"></pre><h3>当前信息</h3><pre id="target"></pre>
<label>处置 <select id="action"><option value="">请选择</option><option value="RETAIN">原值保留</option><option value="GENERALIZE">降低具体程度</option><option value="PSEUDONYMIZE">稳定代号或称谓</option><option value="LOCAL_AGGREGATE">本机汇总</option><option value="DELETE">不呈现该信息</option><option value="PAUSE">需先核实关键事实</option></select></label>
<label>需要留下的事实与理由<textarea id="reason"></textarea></label><label>期望表达或需要追问的问题<textarea id="rendering"></textarea></label>
<script>const data=/*PAYLOAD*/;let i=0;let answers={};const $=id=>document.getElementById(id);function show(){const c=data.cases[i],a=answers[c.case_id]||{};$('request').textContent=c.task_description;$('context').textContent=c.context;$('target').textContent=c.target;$('doc').replaceChildren();let end=0;for(const start of c.target_occurrences){$('doc').append(document.createTextNode(c.text.slice(end,start)));const m=document.createElement('mark');m.textContent=c.target;$('doc').append(m);end=start+c.target.length;}$('doc').append(document.createTextNode(c.text.slice(end)));$('action').value=a.action||'';$('reason').value=a.reason||'';$('rendering').value=a.expected_rendering||'';$('status').textContent=`${i+1}/${data.cases.length} · ${c.case_id} · 已确认 ${Object.keys(answers).length}`;}
$('prev').onclick=()=>{i=Math.max(0,i-1);show()};$('next').onclick=()=>{i=Math.min(data.cases.length-1,i+1);show()};$('save').onclick=()=>{if(!$('action').value||!$('reason').value.trim()||!$('rendering').value.trim()){alert('请补齐处置、理由和期望表达。');return;}const c=data.cases[i];answers[c.case_id]={case_id:c.case_id,input_sha256:c.input_sha256,action:$('action').value,reason:$('reason').value,expected_rendering:$('rendering').value,human_confirmed:true,confirmed_at:new Date().toISOString()};show()};$('export').onclick=()=>{if(!$('reviewer').value.trim()){alert('请填写复核人');return;}const blob=new Blob([JSON.stringify({schema:'context-review-response-v4',reviewer:$('reviewer').value,assisted:$('assisted').checked,reviews:Object.values(answers),total:data.cases.length},null,2)],{type:'application/json'});const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='上下文复核结果.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('load').onchange=async e=>{try{const r=JSON.parse(await e.target.files[0].text());if(r.schema!=='context-review-response-v4')throw Error('复核文件格式不符');const known=new Map(data.cases.map(c=>[c.case_id,c.input_sha256]));const next={};for(const a of r.reviews){if(known.get(a.case_id)!==a.input_sha256||next[a.case_id]||a.human_confirmed!==true)throw Error('题目版本、重复或确认状态不符');next[a.case_id]=a;}answers=next;$('reviewer').value=r.reviewer||'';$('assisted').checked=r.assisted===true;show()}catch(err){alert(err.message)}};show();</script></html>
