 const box=el('section',undefined,$('record'));el('h2',`${r.batch} / ${r.reviewer} / ${r.id}`,box);const context={};for(const k of ['task','task_description','identity','recipient','trusted_context','trusted_policy'])if(k in r)context[k]=r[k];if(Object.keys(context).length)el('pre',JSON.stringify(context,null,2),box);
 el('p','实体标注：在原文框中选中文字，再选择类别并点击添加。空实体列表表示没有应标实体；字段名称和无关数字不标。',box);
 const turns=r.kind==='dialogue'?r.turns:[{text:r.text,turn_id:null}];
 turns.forEach((t,i)=>{const a=r.kind==='dialogue'?r.annotation.turns[i]:r.annotation;const sec=el('section',undefined,$('record'));el('h2',t.turn_id?`第 ${t.turn_id} 轮`:'原始材料',sec);
 if(r.kind==='dialogue'&&i>0){el('small','此前已允许外发的内容（按你本人的前轮标注实时更新）',sec);const hist=el('pre','[]',sec);hist.dataset.historyIndex=i;}
 const src=el('textarea',undefined,sec);src.className='source';src.readOnly=true;src.value=t.text;
 const select=el('select',undefined,sec);cats.forEach((c,j)=>{const opt=el('option',`${catNames[j]}  ${c}`,select);opt.value=c});const add=el('button','添加所选实体',sec);const entries=el('div',undefined,sec);
 function showEntities(){entries.replaceChildren();a.entities.forEach((e,n)=>{const item=el('div',`${e.category} [${e.start}, ${e.end}) ${e.text}`,entries);item.className='entity';const del=el('button','移除',item);del.onclick=()=>{a.entities.splice(n,1);showEntities();edited(r)}})}
 add.onclick=()=>{const start=Array.from(t.text.slice(0,src.selectionStart)).length,end=Array.from(t.text.slice(0,src.selectionEnd)).length;if(start===end){alert('请先选中原文中的实体文字');return}const e={start,end,text:Array.from(t.text).slice(start,end).join(''),category:select.value};if(a.entities.some(x=>x.start===start&&x.end===end&&x.category===e.category)){alert('该实体已存在');return}a.entities.push(e);a.entities.sort((x,y)=>x.start-y.start);showEntities();edited(r)};showEntities();
 if(a.target){const target=a.target;el('p','选择首选处理动作，并勾选所有同样安全且满足任务的可接受动作。类别本身不能决定动作。',sec);const choice=el('select',undefined,sec);const empty=el('option','请选择首选动作',choice);empty.value='';actions.forEach((c,j)=>{const opt=el('option',`${c}  ${names[j]}`,choice);opt.value=c});choice.value=target.preferred_action||'';
 choice.onchange=()=>{target.preferred_action=choice.value||null;target.send_allowed=choice.value?choice.value!=='PAUSE':null;if(choice.value==='PAUSE'){target.sanitized_text=null;output.value=''}edited(r)};
 const accepts=el('div',undefined,sec);actions.forEach((c,j)=>{const label=el('label',undefined,accepts);const cb=el('input',undefined,label);cb.type='checkbox';cb.checked=target.acceptable_actions.includes(c);label.append(document.createTextNode(names[j]));cb.onchange=()=>{target.acceptable_actions=actions.filter(x=>x===c?cb.checked:target.acceptable_actions.includes(x));edited(r)}});
 el('p','应发送给外部模型的脱敏内容（暂停时留空；允许外发时填写完整内容）',sec);const output=el('textarea',undefined,sec);output.value=target.sanitized_text||'';output.oninput=()=>{target.sanitized_text=target.preferred_action==='PAUSE'?null:output.value;edited(r)};
 el('p','判断理由（任务必要性、权限或多轮风险）',sec);const why=el('textarea',undefined,sec);why.value=target.reason;why.oninput=()=>{target.reason=why.value;edited(r)};
 }});
 const end=el('section',undefined,$('record'));el('p','备注与疑问',end);const notes=el('textarea',undefined,end);notes.value=r.notes;notes.oninput=()=>r.notes=notes.value;const label=el('label',undefined,end);const done=el('input',undefined,label);done.type='checkbox';done.dataset.completed='true';done.checked=r.reviewed;label.append(document.createTextNode('确认本条全部标注已完成'));
 done.onchange=()=>{const error=done.checked&&validationError(r);if(error){done.checked=false;alert(error);return}mark(r,done.checked,'single');selected.delete(r.id);refreshStatus()};refreshStatus();}
$('prev').onclick=()=>{pos=Math.max(0,pos-1);render()};$('next').onclick=()=>{pos=Math.min(data.length-1,pos+1);render()};$('jump').onchange=e=>{pos=Number(e.target.value);render()};
$('save').onclick=()=>{const blob=new Blob([data.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/jsonl;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${data[0].batch}_复核员${data[0].reviewer}_结果.jsonl`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('load').onchange=async e=>{if(!e.target.files.length)return;try{const rows=(await e.target.files[0].text()).split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x));if(rows.length!==original.length)throw Error('记录数量不一致');const map=new Map(rows.map(x=>[x.id,x]));if(map.size!==rows.length)throw Error('有重复 ID');const imported=original.map(o=>{const x=map.get(o.id);if(!x)throw Error('ID不匹配');for(const k of Object.keys(o).filter(k=>!['annotation','reviewed','notes','review_audit'].includes(k)))if(JSON.stringify(x[k])!==JSON.stringify(o[k]))throw Error(`原文、批次或复核员不匹配：${o.id}`);if(typeof x.reviewed!=='boolean')throw Error('完成状态格式错误');checkShape(x);checkAudit(x);const error=x.reviewed&&validationError(x);if(error)throw Error(`${x.id}：${error}`);return x});data=imported;selected.clear();lastBatch=null;$('bulk-empty').checked=false;$('bulk-result').textContent='已导入进度，现有标注与操作记录已保留。';render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
window.addEventListener('beforeunload',e=>{if(JSON.stringify(data)!==JSON.stringify(original)){e.preventDefault();e.returnValue='请先下载进度'}});render();
</script></html>
