<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI初审稿 · 用户二审</title><style>
*{box-sizing:border-box}body{margin:24px auto;max-width:1000px;padding:0 18px;background:#f5f6f8;color:#222;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}h1{font-size:24px}section{background:white;border:1px solid #ddd;padding:20px;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}label{display:block;margin:12px 0}textarea{width:100%;min-height:85px}button,input,select,textarea{font:inherit;padding:8px;max-width:100%}button{cursor:pointer;margin:4px}.muted{color:#626a73}.flag{border-left:3px solid #ad7620;padding-left:14px}#progress{font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style><h1>AI初审稿，供你二审</h1><p>36份材料、138处判断已载入。修改后逐题确认，关闭前导出。所有内容只保存在当前页面内存。</p>
<section><div class="row"><label>你的姓名或编号 <input id="reviewer"></label><button id="export">导出二审进度</button><label>载入进度 <input id="resume" type="file" accept=".json"></label></div>
<div class="row"><label>查看范围 <select id="filter"><option value="all">全部判断</option><option value="priority">重点二审</option><option value="pending">尚未确认</option><option value="changed">本次改动动作</option></select></label><label>跳到题目 <select id="jump"></select></label></div><p id="status" class="muted"></p></section>
<section><div class="row"><button id="prev">上一题</button><span id="progress"></span><button id="next">下一题</button></div><p id="meta" class="muted"></p><h3>用户要求</h3><pre id="task"></pre><details open><summary>来往背景与完整材料</summary><pre id="context"></pre></details><h3>本题片段与实体</h3><pre id="source"></pre><p id="note" class="flag"></p>
<label>首选动作 <select id="action"></select></label><p id="representation" class="muted"></p><label>完成任务必须保留的事实或关系<textarea id="facts"></textarea></label><label>判断理由／你补充的意见<textarea id="reason"></textarea></label><button id="confirm">确认本题并下一题</button><p class="muted">“暂停”只针对该项不确定信息；其他已经确认的事项可以先处理。</p></section>
<script>
'use strict';
const payload=/*__PAYLOAD__*/;
const $=id=>document.getElementById(id), task=payload.task, original=payload.draft;
const representations={DELETE:'none',LOCAL_AGGREGATE:'local_aggregate',GENERALIZE:'coarse',PSEUDONYMIZE:'pseudonym',RETAIN:'original',PAUSE:'uncertain'};
const names={DELETE:'删除目标实体',LOCAL_AGGREGATE:'本机聚合',GENERALIZE:'泛化',PSEUDONYMIZE:'稳定代号',RETAIN:'保留原值',PAUSE:'暂停该项，先澄清'};
let rows=structuredClone(original.reviews),confirmed=new Set(),visible=[],index=0;
for(const [v,n]of Object.entries(names))$('action').add(new Option(v+' · '+n,v));
function refresh(keep){const mode=$('filter').value;visible=rows.map((r,i)=>i).filter(i=>mode==='all'||(mode==='priority'&&rows[i].priority)||(mode==='changed'&&rows[i].changed_action)||(mode==='pending'&&!confirmed.has(rows[i].case_id)));index=Math.max(0,visible.findIndex(i=>rows[i].case_id===keep));$('jump').replaceChildren();visible.forEach((i,n)=>$('jump').add(new Option(rows[i].case_id+(confirmed.has(rows[i].case_id)?' · 已确认':''),n)));show();}
function show(){if(!visible.length){$('status').textContent='当前筛选范围已无待看题目，可以切回全部或导出。';return;}const i=visible[index],r=rows[i],c=task.cases[i];$('jump').value=index;$('progress').textContent=`${index+1} / ${visible.length} · 人工已确认 ${confirmed.size} / ${rows.length}`;$('meta').textContent=c.case_id+' · 接收方 '+c.recipient+' · '+(confirmed.has(c.case_id)?'你已确认':'AI初审，待你确认');$('task').textContent=c.task_description;$('context').textContent=c.context;$('source').textContent=c.text+'\n\n目标实体：'+c.entities.map(e=>e.text+' ['+e.category+']').join('；');$('note').textContent=r.review_note+(r.changed_action?' 原建议：'+r.original_proposal_action+' → 初审：'+original.reviews[i].annotation.action:'');$('action').value=r.annotation.action;$('facts').value=r.annotation.required_facts;$('reason').value=r.annotation.reason;$('representation').textContent='表达形式：'+r.annotation.minimum_representation;$('status').textContent='未确认题保持AI来源；只有点“确认本题”的记录才计入你的二审。';}
function move(n){if(!visible.length)return;index=Math.max(0,Math.min(visible.length-1,index+n));show();}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('jump').onchange=()=>{index=Number($('jump').value);show();};$('filter').onchange=()=>refresh();$('action').onchange=()=>{$('representation').textContent='表达形式：'+representations[$('action').value];};
$('confirm').onclick=()=>{if(!visible.length)return;const i=visible[index],r=rows[i];if(!$('facts').value.trim()||!$('reason').value.trim()){$('status').textContent='必要事实与理由都需填写。';return;}const action=$('action').value;r.annotation={...r.annotation,action,allowed_actions:[action],minimum_representation:representations[action],required_facts:$('facts').value.trim(),reason:$('reason').value.trim()};if(action!==original.reviews[i].annotation.action){delete r.annotation.clarification_question;delete r.annotation.evidence;}confirmed.add(r.case_id);if($('filter').value==='pending')refresh();else move(1);};
$('export').onclick=()=>{const reviewer=$('reviewer').value.trim();if(!reviewer){$('status').textContent='请先填写你的姓名或编号。';return;}const result={schema:'action-review-response-v1',role:'human_second_review',reviewer,reviewer_kind:confirmed.size===rows.length?'human_assisted':'mixed_ai_human_pending',human_reviewed:confirmed.size===rows.length,review_status:confirmed.size===rows.length?'human_second_review_complete':'human_second_review_partial',independent_blind_review:false,machine_suggestions_consulted_before_decisions:true,confirmed_case_ids:[...confirmed],exported_at:new Date().toISOString(),previous_review_provenance:{reviewer:original.reviewer,reviewer_kind:'ai'},reviews:rows.map((r,i)=>({...r,reviewer_kind:confirmed.has(r.case_id)?'human_assisted':'ai',human_reviewed:confirmed.has(r.case_id),human_confirmed:confirmed.has(r.case_id),original_ai_annotation:original.reviews[i].annotation}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='用户二审进度-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=`已导出。人工确认 ${confirmed.size} 题，其余仍待二审。`;};
$('resume').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.role!=='human_second_review'||!Array.isArray(data.reviews)||data.reviews.length!==rows.length)throw Error('不是本包的二审进度');const saved=new Map(data.reviews.map(r=>[r.case_id,r]));for(const c of task.cases){if(saved.get(c.case_id)?.case_sha256!==c.case_sha256)throw Error('题目版本不匹配');}if(saved.size!==rows.length)throw Error('有重复或缺失题目');const ids=data.confirmed_case_ids||[];if(ids.some(id=>!saved.has(id)))throw Error('确认题号不匹配');rows=task.cases.map(c=>saved.get(c.case_id));confirmed=new Set(ids);$('reviewer').value=data.reviewer||'';refresh();}catch(err){$('status').textContent=err.message;}};
refresh();
</script></html>
