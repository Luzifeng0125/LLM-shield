 el('p','判断理由（任务必要性、权限或多轮风险）',sec);const why=el('textarea',undefined,sec);why.value=target.reason;why.oninput=()=>{target.reason=why.value;edited(r)};
 }});
 const end=el('section',undefined,$('record'));el('p','备注与疑问',end);const notes=el('textarea',undefined,end);notes.value=r.notes;notes.oninput=()=>r.notes=notes.value;const label=el('label',undefined,end);const done=el('input',undefined,label);done.type='checkbox';done.dataset.completed='true';done.checked=r.reviewed;label.append(document.createTextNode('确认本条全部标注已完成'));
 done.onchange=()=>{const error=done.checked&&validationError(r);if(error){done.checked=false;alert(error);return}mark(r,done.checked,'single');selected.delete(r.id);refreshStatus()};refreshStatus();}
$('prev').onclick=()=>{pos=Math.max(0,pos-1);render()};$('next').onclick=()=>{pos=Math.min(data.length-1,pos+1);render()};$('jump').onchange=e=>{pos=Number(e.target.value);render()};
$('save').onclick=()=>{const blob=new Blob([data.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/jsonl;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${data[0].batch}_复核员${data[0].reviewer}_结果.jsonl`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('load').onchange=async e=>{if(!e.target.files.length)return;try{const rows=(await e.target.files[0].text()).split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x));if(rows.length!==original.length)throw Error('记录数量不一致');const map=new Map(rows.map(x=>[x.id,x]));if(map.size!==rows.length)throw Error('有重复 ID');const imported=original.map(o=>{const x=map.get(o.id);if(!x)throw Error('ID不匹配');for(const k of Object.keys(o).filter(k=>!['annotation','reviewed','notes','review_audit'].includes(k)))if(JSON.stringify(x[k])!==JSON.stringify(o[k]))throw Error(`原文、批次或复核员不匹配：${o.id}`);if(typeof x.reviewed!=='boolean')throw Error('完成状态格式错误');checkShape(x);checkAudit(x);const error=x.reviewed&&validationError(x);if(error)throw Error(`${x.id}：${error}`);return x});data=imported;selected.clear();lastBatch=null;$('bulk-empty').checked=false;$('bulk-result').textContent='已导入进度，现有标注与操作记录已保留。';render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
window.addEventListener('beforeunload',e=>{if(JSON.stringify(data)!==JSON.stringify(original)){e.preventDefault();e.returnValue='请先下载进度'}});render();
